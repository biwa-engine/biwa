[package]
name = "biwa_hub_client"
version = "0.1.0"
edition = "2024"

[dependencies]
# request/response model の型を参照。axum などサーバ側の重い依存は "server" feature の
# 背後に隠れているため、default-features のまま使えば DTO の型定義だけを引き込む。
biwa_hub_presentation = { path = "../server/crates/biwa_hub_presentation", default-features = false }

# コンパイラ/CLI/LSP はいずれも非同期ランタイムを持たない同期的なコードなので、
# クライアントも `reqwest::blocking` で揃える。
# native-tls (OpenSSL) は環境にビルド依存 (pkg-config 等) を要求するため rustls を使う。
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
thiserror = "1"

[package]
name = "biwa_lsp_server"
version = "0.1.0"
edition = "2024"

[dependencies]
tower-lsp        = "0.20"
tokio            = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
biwa_lsp_highlight = { path = "../biwa_lsp_highlight" }
biwa_lsp_resolve = { path = "../biwa_lsp_resolve" }
# 改行の正規化 (`normalize_newlines`) を実コンパイラと共有するため。
biwac_base = { path = "../../../../compiler/src/biwac_base" }

[[bin]]
name = "biwa-lsp"
path = "src/main.rs"

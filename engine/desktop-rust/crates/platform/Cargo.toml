[package]
name = "biwa-player-platform"
description = "Window, input and event loop of the Biwa native player (winit), exposed as Biwa's own events."
version.workspace = true
edition.workspace = true
publish.workspace = true

# winit の型はこの crate の外に出さない。外から見えるのは自前のイベントとウィンドウ
# (描画が要る raw-window-handle のトレイトだけを実装する)。
[dependencies]
winit.workspace = true
raw-window-handle.workspace = true

# ウィンドウの縦横比の固定 (`aspect.rs`)。winit に API が無いので OS の API を直接呼ぶ。
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

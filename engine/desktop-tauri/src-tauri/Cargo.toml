[package]
name = "biwa-desktop"
version = "0.1.0"
edition = "2024"
publish = false

# 置かれた場所の親に Cargo workspace があっても巻き込まれないように、単独の workspace にする。
[workspace]

[[bin]]
name = "biwa-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools`: 配布版でも開発者ツールを開けるようにする (WebView の検証のため)。
# 検証が済んだら外す。
tauri = { version = "2", features = ["devtools"] }
# `--localhost` で起動したときに、静的ビルドを http://localhost で配る (src/main.rs)。
tauri-plugin-localhost = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

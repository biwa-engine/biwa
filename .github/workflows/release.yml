# Biwa のツールチェイン (CLI + 全ターゲットの runtime) を組み立てる。手で実行する (workflow_dispatch)。
#
# ツールチェインはバージョンの単位で、名前はコミットの先頭 12 文字 (cli/build.rs と cli/src/toolchain.rs)。
# CLI と runtime を同じコミットから同じ実行の中でビルドし、ゲームを作る人の OS (ホスト) ごとに、
# `~/.biwa` (BIWA_HOME) にそのまま展開できるアーカイブにする:
#
#   bin/biwa[.exe]                                         ← そのホストの CLI
#   toolchains/<toolchain>/runtime/<runtime-id>/biwa-runtime[.exe]   ← 全ターゲットの runtime (6 種類)
#
# 全ターゲットの runtime を入れるのは、どの OS の上でも全 OS 向けの配布物を作れるようにするため。
# 成果物は `biwa-toolchain-<host>` (中身は `biwa-<toolchain>-<host>.{tar.gz,zip}`)。
# 展開のしかたは docs/desktop-build.md。方針は docs/biwa-prebuilt-player.md。
name: release

on:
  workflow_dispatch:

jobs:
  runtime-native:
    uses: ./.github/workflows/runtime-native.yml

  runtime-webview:
    uses: ./.github/workflows/runtime-webview.yml

  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: windows-x86_64
            os: windows-latest
            file: biwa.exe
          - host: macos-universal
            os: macos-latest
            file: biwa
          # glibc の古い版でも動くように、なるべく古い runner でビルドする。
          - host: linux-x86_64
            os: ubuntu-22.04
            file: biwa
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Biwa Package Hub の URL はリポジトリの変数があれば焼き込む (tools/hub/client/build.rs)。
      # 空のまま渡すと空の URL が焼き込まれるので、あるときだけ置く。
      - name: Hub URL
        env:
          HUB: ${{ vars.BIWA_HUB_URL }}
        run: |
          if [ -n "$HUB" ]; then echo "BIWA_HUB_URL=$HUB" >> "$GITHUB_ENV"; fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target

      - name: Build (Windows / Linux)
        if: runner.os != 'macOS'
        run: |
          cargo build --release
          mkdir -p out
          cp target/release/${{ matrix.file }} out/
          ./out/${{ matrix.file }} --version

      # Apple Silicon と Intel の両方で動く universal バイナリにする。
      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p out
          lipo -create -output out/biwa \
            target/aarch64-apple-darwin/release/biwa \
            target/x86_64-apple-darwin/release/biwa
          lipo -info out/biwa
          ./out/biwa --version

      - uses: actions/upload-artifact@v4
        with:
          name: biwa-cli-${{ matrix.host }}
          path: cli/out/${{ matrix.file }}
          if-no-files-found: error

  bundle:
    needs: [runtime-native, runtime-webview, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble
        run: |
          set -euo pipefail
          toolchain="${GITHUB_SHA::12}"
          runtimes="native-windows-x86_64 native-macos-universal native-linux-x86_64
                    webview-windows-x86_64 webview-macos-universal webview-linux-x86_64"
          mkdir -p out
          for host in windows-x86_64 macos-universal linux-x86_64; do
            root="stage/$host"
            mkdir -p "$root/bin"
            # 成果物の取り出しで実行ビットが落ちるので付け直す。
            cp artifacts/biwa-cli-$host/* "$root/bin/"
            chmod +x "$root"/bin/*
            for id in $runtimes; do
              dir="$root/toolchains/$toolchain/runtime/$id"
              mkdir -p "$dir"
              cp artifacts/biwa-runtime-$id/* "$dir/"
              chmod +x "$dir"/*
            done
            name="biwa-$toolchain-$host"
            if [ "$host" = windows-x86_64 ]; then
              (cd "$root" && zip -qr "$GITHUB_WORKSPACE/out/$name.zip" .)
            else
              tar -czf "out/$name.tar.gz" -C "$root" .
            fi
          done
          # Linux の CLI が自分の名前として同じツールチェインを名乗るか確かめる。
          ./stage/linux-x86_64/bin/biwa --version | tee /dev/stderr | grep -q "($toolchain)"
          ls -la out
          find stage -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: biwa-toolchain-windows-x86_64
          path: out/*-windows-x86_64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: biwa-toolchain-macos-universal
          path: out/*-macos-universal.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: biwa-toolchain-linux-x86_64
          path: out/*-linux-x86_64.tar.gz
          if-no-files-found: error

# Biwa のネイティブのプレイヤー (engine/desktop-rust) を 3 OS でビルドする。
#
# プレイヤーはゲームに依らない汎用の実行ファイルで、`biwa build --platform windows|macos|linux`
# (既定の `desktop` も) はこれにゲームのデータ (`game.wasm` + `assets/`) を添えて配布物を組み立てる
# (docs/biwa-prebuilt-player.md, cli/src/player.rs)。
# 成果物は `biwa-player-<id>` という名前で上がる。取り出したものを
# `~/.biwa/players/<id>/` (または `biwa build --players-dir`) に置いて使う。
# (WebView のプレイヤーは player-webview.yml)
name: player-native

on:
  workflow_dispatch:
  push:
    paths:
      - "engine/desktop-rust/**"
      - ".github/workflows/player-native.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x86_64
            os: windows-latest
            file: biwa-player.exe
          - id: macos-universal
            os: macos-latest
            file: biwa-player
          # glibc の古い版でも動くように、なるべく古い runner でビルドする。
          - id: linux-x86_64
            os: ubuntu-22.04
            file: biwa-player
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine/desktop-rust
    steps:
      - uses: actions/checkout@v4

      # fontconfig はフォントを探すのに使う (リンクする)。
      # CJK のフォントは文字の整形のテストが使う (配布物には要らない)。
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig1-dev fonts-noto-cjk

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/desktop-rust -> target

      - name: Build (Windows / Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cargo build --release -p biwa-player
          mkdir -p out
          cp target/release/${{ matrix.file }} out/

      # Apple Silicon と Intel の両方で動く universal バイナリにする。
      # 署名は `biwa build` が .app を組み立てたあとに付け直すので、ここではしない。
      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p biwa-player --target aarch64-apple-darwin
          cargo build --release -p biwa-player --target x86_64-apple-darwin
          mkdir -p out
          lipo -create -output out/biwa-player \
            target/aarch64-apple-darwin/release/biwa-player \
            target/x86_64-apple-darwin/release/biwa-player
          lipo -info out/biwa-player

      - uses: actions/upload-artifact@v4
        with:
          name: biwa-player-${{ matrix.id }}
          path: engine/desktop-rust/out/${{ matrix.file }}
          if-no-files-found: error

      # 成果物を上げてから試す (文字の整形のテストは OS のフォントに依るので、落ちても実機で試せるように)。
      # 描画のテストは GPU を使わない (render のテストは計算だけ)。
      - name: Test
        run: cargo test --release --workspace
